[package]
name = "just-common"
description = "Shared HTTP transport, SSE stream parsing, and error types for the just-agent ecosystem"
readme = "README.md"
edition = "2024"
version = "0.2.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["sse", "http-client", "openai"]
categories = [
  "web-programming::http-client",
  "asynchronous",
  "parser-implementations",
]

[features]
# Off here on purpose: the providers and `just-llm-client` turn it on; low-level users opt in.
http2 = ["reqwest/http2"]

[dependencies]
async-stream = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
wiremock = { workspace = true }

[[test]]
name = "h2_protocol"
required-features = ["http2"]
